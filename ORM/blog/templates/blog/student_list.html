<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Blog: Student List</title>
</head>
<body>
    <h2>Student Information</h2>
    {% if students %}   
    <table>
        <thead>
            <tr>
                <th>Name</th>
                <th>Age</th>
                <th>city</th>
                <th>Email</th>
                <th>Enrollment_date</th>
            </tr>
        </thead>
        <tbody>
            {% for student in students %}
                <tr>
                    <td>{{ student.name }}</td>
                    <td>{{ student.age }}</td>
                    <td>{{ student.city }}</td>
                    <td>{{ student.email }}</td>
                    <td>{{ student.enrollment_date }}</td>
                </tr>
            {% endfor %}
        </tbody>
    </table>
    {% else %}
        <p>No students found.</p>
    {% endif %}
</body>
</html>
